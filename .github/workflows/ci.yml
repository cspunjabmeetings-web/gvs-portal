# spec: 13 (khudkar jaanch); owner ka CHANGE REQUEST "CI" (16 Nov 2026)
# Har push aur Pull Request par `npm run verify`. Hara ✅ = saari jaanchein pass.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install (lock file ke mutabiq)
        run: npm ci

      - name: Verify (test, scope, typecheck, build, bundle)
        run: npm run verify
