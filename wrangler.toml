# spec: 3.1 Hosting (Workers + static assets, P-01), 4.1 D1 (Qadam 5), 4.4 R2 (Qadam 13c), SA9/F24-AC6 Cron Trigger (Qadam 17a).
name = "gvs-portal"
# Adapter ka `handle` (fetch) + `scheduled` (maintenance) — src/worker.ts
main = "src/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"
# Qadam 17b (preview ne pakda): `about/index.html` seedha `/about` par (warna har link par 307 → `/about/`).
html_handling = "drop-trailing-slash"

# spec: 4.1 D1, 7.6. Remote DB owner ne banaya (Qadam 17b, `wrangler d1 create gvs`); preview aur production
# dono yahi DB (17a faisla 2a). Remote migration sirf owner ki manzoori se (spec 13.3). Local par Miniflare.
[[d1_databases]]
binding = "DB"
database_name = "gvs"
database_id = "7bd6e0dd-2924-435d-9b5b-21e437cf4ad1"
# Local (Miniflare) ki file isi id se banti hai: purani placeholder id rakhi taake local test data wahi rahe.
preview_database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"


# spec: 4.4 R2 (sirf job tasveerein, E22). Abhi sirf local (Miniflare). Asal bucket (`wrangler r2 bucket create gvs-images`)
# aur custom domain `img.<domain>` (P-11) owner ki ijazat se Qadam 18 mein; phir PUBLIC_IMG_BASE = https://img.<domain>
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "gvs-images"

# spec: SA9, F24-AC6 (P-04): har 15 minute maintenance (`scheduled` in src/worker.ts). Free plan mein shamil.
[triggers]
crons = ["*/15 * * * *"]
